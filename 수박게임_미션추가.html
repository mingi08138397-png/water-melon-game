<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수박게임 클론</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf6e3;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    width: 100%;
    max-width: 600px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    color: #c0392b;
  }

  .settings-icon-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #c0392b;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    flex-shrink: 0;
  }

  .settings-icon-btn:hover {
    background: #fbeee9;
  }

  .game-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .side-panel {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 10px;
    width: 400px;
    max-width: 100%;
  }

  .panel-box {
    background: #fff;
    border-radius: 12px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    flex: 1;
    min-width: 0;
  }

  .panel-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
  }

  .score-value {
    font-size: 24px;
    font-weight: bold;
    color: #c0392b;
  }

  .next-preview {
    font-size: 32px;
    line-height: 1;
  }

  .restart-btn {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #c0392b;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
    min-width: 0;
  }

  .restart-btn:hover {
    background: #a93226;
  }

  .canvas-wrap {
    position: relative;
    width: 400px;
    max-width: 100%;
  }

  #game-canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #fffdf5;
    border: 3px solid #c0392b;
    border-radius: 8px;
    touch-action: none;
    cursor: pointer;
  }

  .game-over {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }

  .game-over.hidden {
    display: none;
  }

  .game-over-box {
    background: #fff;
    border-radius: 12px;
    padding: 24px 32px;
    text-align: center;
  }

  .game-over-box h2 {
    margin-top: 0;
    color: #c0392b;
  }

  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 16px;
  }

  .settings-overlay.hidden {
    display: none;
  }

  .settings-box {
    background: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    max-width: 320px;
    width: 100%;
  }

  .settings-box h2 {
    margin-top: 0;
    color: #c0392b;
    font-size: 18px;
  }

  .settings-hint {
    font-size: 12px;
    color: #888;
    line-height: 1.5;
  }

  .key-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 10px 0;
  }

  .key-row span {
    font-size: 14px;
    color: #333;
  }

  .key-btn {
    padding: 8px 10px;
    border: 2px solid #c0392b;
    border-radius: 8px;
    background: #fdf6e3;
    color: #c0392b;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    min-width: 110px;
    text-align: center;
  }

  .key-btn.listening {
    background: #c0392b;
    color: #fff;
  }

  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .settings-actions button {
    flex: 1;
  }

  .reset-btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #eee;
    color: #333;
    font-size: 14px;
    cursor: pointer;
  }

  .reset-btn:hover {
    background: #ddd;
  }

  .mission-panel {
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    width: 400px;
    max-width: 100%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    position: relative;
  }

  .mission-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .mission-title {
    font-weight: bold;
    color: #c0392b;
    font-size: 14px;
  }

  .mission-reroll-btn {
    border: none;
    border-radius: 8px;
    background: #fdf6e3;
    color: #c0392b;
    font-size: 12px;
    font-weight: bold;
    padding: 6px 10px;
    cursor: pointer;
  }

  .mission-reroll-btn:hover:not(:disabled) {
    background: #fbeee9;
  }

  .mission-reroll-btn:disabled {
    color: #bbb;
    cursor: not-allowed;
  }

  .mission-body {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .mission-text {
    font-size: 15px;
    font-weight: bold;
    color: #333;
  }

  .mission-progress {
    font-size: 13px;
    color: #888;
    white-space: nowrap;
  }

  .mission-footer {
    margin-top: 4px;
  }

  .mission-reward {
    font-size: 12px;
    color: #16a085;
    font-weight: bold;
  }

  .mission-notice {
    position: absolute;
    left: 50%;
    top: -14px;
    transform: translate(-50%, -100%);
    background: #2ecc71;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }

  .mission-notice.show {
    opacity: 1;
    transform: translate(-50%, -130%);
  }

  .fruit-picker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 14px;
  }

  .fruit-picker-btn {
    border: 2px solid #c0392b;
    border-radius: 10px;
    background: #fdf6e3;
    padding: 8px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 11px;
    color: #333;
  }

  .fruit-picker-btn:hover {
    background: #fbeee9;
  }

  .fruit-picker-emoji {
    font-size: 24px;
    line-height: 1;
  }

  @media (max-width: 480px) {
    .app {
      padding: 12px;
    }

    .header-row {
      max-width: 100%;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 20px;
    }

    .settings-icon-btn {
      width: 34px;
      height: 34px;
      font-size: 16px;
    }

    .score-value {
      font-size: 20px;
    }

    .next-preview {
      font-size: 28px;
    }

    .restart-btn {
      padding: 8px;
      font-size: 13px;
    }

    .mission-panel {
      padding: 10px 12px;
    }

    .mission-text {
      font-size: 13px;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header-row">
      <h1>수박게임</h1>
      <button id="settings-btn" class="settings-icon-btn" title="키 설정" aria-label="키 설정">⚙</button>
    </div>

    <div class="game-wrap">
      <div class="side-panel">
        <div class="panel-box">
          <span class="panel-label">점수</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="panel-box">
          <span class="panel-label">다음 과일</span>
          <div id="next-preview" class="next-preview"></div>
        </div>
        <button id="restart-btn" class="restart-btn">재시작</button>
      </div>

      <div class="mission-panel">
        <div id="mission-notice" class="mission-notice"></div>
        <div class="mission-header">
          <span class="mission-title">🎯 미션</span>
          <button id="mission-reroll-btn" class="mission-reroll-btn">🔄 리롤 (3)</button>
        </div>
        <div class="mission-body">
          <span id="mission-text" class="mission-text">미션 준비 중...</span>
          <span id="mission-progress" class="mission-progress">0/0</span>
        </div>
        <div class="mission-footer">
          <span id="mission-reward" class="mission-reward">보상: -</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="game-over" class="game-over hidden">
          <div class="game-over-box">
            <h2>게임 오버</h2>
            <p>최종 점수: <span id="final-score">0</span></p>
            <button id="game-over-restart-btn" class="restart-btn">다시 시작</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-box">
      <h2>PC 키 설정</h2>
      <p class="settings-hint">모바일에서는 화면을 터치해서 이동/드롭할 수 있어요. PC에서는 마우스 외에 아래 키로도 조작할 수 있습니다. 버튼을 누르고 원하는 키를 입력하세요.</p>

      <div class="key-row">
        <span>왼쪽 이동</span>
        <button class="key-btn" id="key-left" data-action="left">ArrowLeft</button>
      </div>
      <div class="key-row">
        <span>오른쪽 이동</span>
        <button class="key-btn" id="key-right" data-action="right">ArrowRight</button>
      </div>
      <div class="key-row">
        <span>과일 드롭</span>
        <button class="key-btn" id="key-drop" data-action="drop">Space</button>
      </div>

      <div class="settings-actions">
        <button id="settings-reset" class="reset-btn">기본값으로</button>
        <button id="settings-close" class="restart-btn">닫기</button>
      </div>
    </div>
  </div>

  <div id="fruit-picker-overlay" class="settings-overlay hidden">
    <div class="settings-box">
      <h2 id="fruit-picker-title">과일을 선택하세요</h2>
      <p class="settings-hint">미션 보상으로 원하는 과일을 골라보세요.</p>
      <div id="fruit-picker-grid" class="fruit-picker-grid"></div>
    </div>
  </div>

  <script>
    // 수박게임 클론 - 순수 JS 물리 구현 (라이브러리 없음)

    const FRUITS = [
      { name: "체리",     emoji: "🍒", radius: 14, color: "#e74c3c", score: 1 },
      { name: "딸기",     emoji: "🍓", radius: 20, color: "#ff6b81", score: 3 },
      { name: "포도",     emoji: "🍇", radius: 26, color: "#8e44ad", score: 6 },
      { name: "귤",       emoji: "🍊", radius: 32, color: "#f39c12", score: 10 },
      { name: "레몬",     emoji: "🍋", radius: 38, color: "#f4d03f", score: 15 },
      { name: "사과",     emoji: "🍎", radius: 44, color: "#e74c3c", score: 21 },
      { name: "배",       emoji: "🍐", radius: 50, color: "#a3cb38", score: 28 },
      { name: "복숭아",   emoji: "🍑", radius: 58, color: "#ffb8b8", score: 36 },
      { name: "파인애플", emoji: "🍍", radius: 66, color: "#f9ca24", score: 45 },
      { name: "멜론",     emoji: "🍈", radius: 76, color: "#78e08f", score: 55 },
      { name: "수박",     emoji: "🍉", radius: 88, color: "#2ecc71", score: 66 },
    ];

    // ---- 미션 설정 ----
    // 미션 대상 티어(과일 병합으로만 만들 수 있는 딸기~수박)별 목표 개수.
    // 상위 티어일수록 만들기 어려우므로 목표 개수를 줄여서 난이도를 맞춘다.
    const MISSION_TARGET_BY_TIER = {
      1: 6,  // 딸기
      2: 5,  // 포도
      3: 4,  // 귤
      4: 4,  // 레몬
      5: 3,  // 사과
      6: 3,  // 배
      7: 2,  // 복숭아
      8: 2,  // 파인애플
      9: 1,  // 멜론
      10: 1, // 수박
    };
    const MISSION_TIERS = Object.keys(MISSION_TARGET_BY_TIER).map(Number);
    const MISSION_REWARD_TYPES = ["score", "fruit", "next"];
    const MISSION_REROLL_MAX = 3;

    const MAX_DROP_TIER = 4; // 처음 떨어뜨릴 수 있는 과일은 체리~레몬 중에서만 등장
    const GRAVITY = 900; // px/s^2
    const WALL_DAMPING = 0.5;
    const RESTITUTION = 0.15;
    const AIR_FRICTION = 0.995;
    const MAX_SPEED = 1200; // px/s, 겹침 보정이 겹쳐서 폭발하듯 튕기는 것을 방지
    const MAX_CORRECTION_PER_STEP = 6; // px, 완전히 겹친 과일도 한 프레임에 순간이동하지 않도록 제한
    const COLLISION_ITERATIONS = 4; // 여러 과일이 동시에 맞닿았을 때 안정적으로 수렴시키기 위한 반복 횟수
    // 쌓여서 정지한 과일도 중력/반발 보정 때문에 매 프레임 완전히 0이 되지는 않고
    // 약 20~25px/s 정도의 잔류 진동이 남는다. 그보다 확실히 높은 값으로 "정지"를 판정한다.
    const SETTLED_SPEED_THRESHOLD = 40;
    const LINE_Y = 90; // 게임오버 판정선
    const DANGER_TIME_LIMIT = 1.2; // 초 단위, 이 시간 이상 라인 위에 머물면 게임오버
    const DROP_COOLDOWN = 0.35; // 초

    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById("score");
    const nextPreviewEl = document.getElementById("next-preview");
    const gameOverEl = document.getElementById("game-over");
    const finalScoreEl = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart-btn");
    const gameOverRestartBtn = document.getElementById("game-over-restart-btn");

    const missionTextEl = document.getElementById("mission-text");
    const missionProgressEl = document.getElementById("mission-progress");
    const missionRewardEl = document.getElementById("mission-reward");
    const missionRerollBtn = document.getElementById("mission-reroll-btn");
    const missionNoticeEl = document.getElementById("mission-notice");
    const fruitPickerOverlay = document.getElementById("fruit-picker-overlay");
    const fruitPickerTitle = document.getElementById("fruit-picker-title");
    const fruitPickerGrid = document.getElementById("fruit-picker-grid");

    let fruits = [];
    let score = 0;
    let isGameOver = false;
    let dropCooldownTimer = 0;
    let idCounter = 0;

    let currentMission = null;
    let missionRerollsLeft = MISSION_REROLL_MAX;
    let missionNoticeTimer = null;
    let fruitPickerOpen = false;
    let pickerPurpose = null; // "spawn" | "next"
    let pickerFinishedTier = null;

    let currentFruitTier = randomDropTier();
    let nextFruitTier = randomDropTier();
    let pointerX = W / 2;

    function randomDropTier() {
      return Math.floor(Math.random() * MAX_DROP_TIER);
    }

    function createFruit(tier, x, y) {
      const def = FRUITS[tier];
      return {
        id: idCounter++,
        tier,
        x,
        y,
        // 완전히 같은 x좌표로만 계속 쌓이면 회전이 없는 원판 물리 특성상 무너지지 않고
        // 얇은 탑처럼 끝없이 올라가므로, 아주 작은 무작위 수평 속도로 그 완벽한 균형을 깬다.
        vx: (Math.random() - 0.5) * 8,
        vy: 0,
        radius: def.radius,
        dangerTime: 0,
        settled: false,
      };
    }

    function resetGame() {
      fruits = [];
      score = 0;
      isGameOver = false;
      dropCooldownTimer = 0;
      currentFruitTier = randomDropTier();
      nextFruitTier = randomDropTier();
      gameOverEl.classList.add("hidden");
      updateScoreUI();
      updateNextPreviewUI();

      missionRerollsLeft = MISSION_REROLL_MAX;
      closeFruitPicker();
      generateMission();
    }

    function updateScoreUI() {
      scoreEl.textContent = score;
    }

    function updateNextPreviewUI() {
      nextPreviewEl.textContent = FRUITS[nextFruitTier].emoji;
    }

    // ---- 미션 로직 ----

    // 이전 미션과 다른 티어를 우선 뽑아 매번 비슷한 미션이 반복되지 않게 한다.
    function generateMission(excludeTier) {
      const pool = MISSION_TIERS.filter((t) => t !== excludeTier);
      const tiers = pool.length ? pool : MISSION_TIERS;
      const tier = tiers[Math.floor(Math.random() * tiers.length)];
      const target = MISSION_TARGET_BY_TIER[tier];
      const rewardType = MISSION_REWARD_TYPES[Math.floor(Math.random() * MISSION_REWARD_TYPES.length)];
      // 점수 보상은 목표 티어와 개수에 비례해서 難도가 높은 미션일수록 더 크게 준다.
      const rewardValue = rewardType === "score" ? Math.round(FRUITS[tier].score * target * 1.3) : 0;

      currentMission = { tier, target, progress: 0, rewardType, rewardValue };
      updateMissionUI();
    }

    function missionRewardLabel(mission) {
      if (mission.rewardType === "score") return `보상: +${mission.rewardValue}점`;
      if (mission.rewardType === "fruit") return "보상: 원하는 과일 생성";
      return "보상: 다음 과일 선택권";
    }

    function updateMissionUI() {
      if (!currentMission) return;
      const def = FRUITS[currentMission.tier];
      missionTextEl.textContent = `${def.emoji} ${def.name} ${currentMission.target}개 만들기`;
      missionProgressEl.textContent =
        `${Math.min(currentMission.progress, currentMission.target)}/${currentMission.target}`;
      missionRewardEl.textContent = missionRewardLabel(currentMission);
      missionRerollBtn.textContent = `🔄 리롤 (${missionRerollsLeft})`;
      missionRerollBtn.disabled = missionRerollsLeft <= 0;
    }

    function showMissionNotice(text) {
      missionNoticeEl.textContent = text;
      missionNoticeEl.classList.add("show");
      clearTimeout(missionNoticeTimer);
      missionNoticeTimer = setTimeout(() => {
        missionNoticeEl.classList.remove("show");
      }, 1600);
    }

    // 병합으로 새 과일이 만들어질 때마다 호출되어 현재 미션의 진행도를 갱신한다.
    function trackMissionProgress(tier) {
      if (!currentMission) return;
      if (tier !== currentMission.tier) return;

      currentMission.progress++;
      if (currentMission.progress >= currentMission.target) {
        completeMission();
      } else {
        updateMissionUI();
      }
    }

    function completeMission() {
      const finished = currentMission;
      showMissionNotice(`미션 완료! ${missionRewardLabel(finished)}`);

      if (finished.rewardType === "score") {
        score += finished.rewardValue;
        updateScoreUI();
        generateMission(finished.tier);
      } else {
        // 과일 생성 / 다음 과일 선택 보상은 사용자가 직접 과일을 고른 뒤에
        // 새 미션을 생성한다 (selectPickedFruit 참고).
        openFruitPicker(finished.rewardType === "fruit" ? "spawn" : "next", finished.tier);
      }
    }

    function buildFruitPickerGrid() {
      fruitPickerGrid.innerHTML = "";
      FRUITS.forEach((def, tier) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "fruit-picker-btn";
        btn.innerHTML = `<span class="fruit-picker-emoji">${def.emoji}</span><span>${def.name}</span>`;
        btn.addEventListener("click", () => selectPickedFruit(tier));
        fruitPickerGrid.appendChild(btn);
      });
    }

    function openFruitPicker(purpose, finishedTier) {
      pickerPurpose = purpose;
      pickerFinishedTier = finishedTier;
      fruitPickerOpen = true;
      fruitPickerTitle.textContent =
        purpose === "spawn" ? "생성할 과일을 선택하세요" : "다음 과일로 선택하세요";
      fruitPickerOverlay.classList.remove("hidden");
    }

    function closeFruitPicker() {
      fruitPickerOpen = false;
      pickerPurpose = null;
      fruitPickerOverlay.classList.add("hidden");
    }

    function selectPickedFruit(tier) {
      if (!fruitPickerOpen) return;

      if (pickerPurpose === "spawn") {
        const def = FRUITS[tier];
        const x = Math.max(def.radius, Math.min(W - def.radius, W / 2 + (Math.random() - 0.5) * 80));
        fruits.push(createFruit(tier, x, LINE_Y - def.radius - 10));
      } else if (pickerPurpose === "next") {
        nextFruitTier = tier;
        updateNextPreviewUI();
      }

      const finishedTier = pickerFinishedTier;
      closeFruitPicker();
      generateMission(finishedTier);
    }

    missionRerollBtn.addEventListener("click", () => {
      if (fruitPickerOpen || missionRerollsLeft <= 0 || !currentMission) return;
      missionRerollsLeft--;
      generateMission(currentMission.tier);
      showMissionNotice("미션을 새로고침했어요");
    });

    buildFruitPickerGrid();

    // ---- 입력 처리: 마우스 / 터치(모바일) / 키보드(PC) ----

    // 캔버스 내부 해상도는 400x600 고정이지만 CSS로 화면 크기에 맞게 축소되므로
    // 실제 화면 좌표를 내부 좌표로 변환해줘야 모바일에서도 정확히 조작된다.
    function getPointerX(evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      return (clientX - rect.left) * (W / rect.width);
    }

    canvas.addEventListener("mousemove", (e) => {
      pointerX = getPointerX(e);
    });

    // 터치 시작 시점에도 위치를 즉시 반영해 "탭만 해도" 그 자리로 과일이 옮겨지게 한다.
    canvas.addEventListener("touchstart", (e) => {
      pointerX = getPointerX(e);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      pointerX = getPointerX(e);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener("click", (e) => {
      dropCurrentFruit(getPointerX(e));
    });

    // touchend 이후 브라우저가 만들어내는 합성 click 이벤트로 인해
    // 드롭이 두 번 발생하지 않도록 기본 동작을 막는다.
    canvas.addEventListener("touchend", (e) => {
      dropCurrentFruit(pointerX);
      e.preventDefault();
    }, { passive: false });

    function dropCurrentFruit(x) {
      if (isGameOver || dropCooldownTimer > 0 || fruitPickerOpen) return;

      const radius = FRUITS[currentFruitTier].radius;
      const clampedX = Math.max(radius, Math.min(W - radius, x));

      fruits.push(createFruit(currentFruitTier, clampedX, LINE_Y - radius - 10));

      currentFruitTier = nextFruitTier;
      nextFruitTier = randomDropTier();
      updateNextPreviewUI();
      dropCooldownTimer = DROP_COOLDOWN;
    }

    restartBtn.addEventListener("click", resetGame);
    gameOverRestartBtn.addEventListener("click", resetGame);

    // ---- PC 키보드 조작 & 키 설정 ----

    const KEY_BINDINGS_STORAGE_KEY = "watermelon-key-bindings";
    const DEFAULT_KEY_BINDINGS = { left: "ArrowLeft", right: "ArrowRight", drop: "Space" };
    const KEY_MOVE_SPEED = 520; // px/s, 키보드로 이동할 때 좌우 속도

    let keyBindings = loadKeyBindings();
    const pressedKeys = new Set();
    let listeningForAction = null; // 키 재설정 대기 중인 액션(left/right/drop)

    function loadKeyBindings() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY_BINDINGS_STORAGE_KEY));
        if (saved && saved.left && saved.right && saved.drop) {
          return saved;
        }
      } catch (e) {
        // 저장된 값이 없거나 손상된 경우 기본값 사용
      }
      return { ...DEFAULT_KEY_BINDINGS };
    }

    function saveKeyBindings() {
      try {
        localStorage.setItem(KEY_BINDINGS_STORAGE_KEY, JSON.stringify(keyBindings));
      } catch (e) {
        // 저장 실패해도 게임 진행에는 지장 없음
      }
    }

    function codeLabel(code) {
      const labels = {
        ArrowLeft: "←",
        ArrowRight: "→",
        ArrowUp: "↑",
        ArrowDown: "↓",
        Space: "Space",
      };
      if (labels[code]) return labels[code];
      if (code.startsWith("Key")) return code.slice(3);
      if (code.startsWith("Digit")) return code.slice(5);
      return code;
    }

    const keyButtons = {
      left: document.getElementById("key-left"),
      right: document.getElementById("key-right"),
      drop: document.getElementById("key-drop"),
    };

    function updateKeyButtonLabels() {
      for (const action of Object.keys(keyButtons)) {
        keyButtons[action].textContent = codeLabel(keyBindings[action]);
      }
    }

    for (const action of Object.keys(keyButtons)) {
      keyButtons[action].addEventListener("click", () => {
        // 이미 다른 키를 기다리고 있었다면 취소하고 새로 시작
        for (const a of Object.keys(keyButtons)) {
          keyButtons[a].classList.remove("listening");
        }
        listeningForAction = action;
        keyButtons[action].classList.add("listening");
        keyButtons[action].textContent = "키를 눌러주세요...";
      });
    }

    const settingsBtn = document.getElementById("settings-btn");
    const settingsOverlay = document.getElementById("settings-overlay");
    const settingsClose = document.getElementById("settings-close");
    const settingsReset = document.getElementById("settings-reset");

    settingsBtn.addEventListener("click", () => {
      settingsOverlay.classList.remove("hidden");
    });

    settingsClose.addEventListener("click", closeSettings);

    settingsOverlay.addEventListener("click", (e) => {
      if (e.target === settingsOverlay) closeSettings();
    });

    function closeSettings() {
      listeningForAction = null;
      for (const a of Object.keys(keyButtons)) {
        keyButtons[a].classList.remove("listening");
      }
      updateKeyButtonLabels();
      settingsOverlay.classList.add("hidden");
    }

    settingsReset.addEventListener("click", () => {
      keyBindings = { ...DEFAULT_KEY_BINDINGS };
      saveKeyBindings();
      listeningForAction = null;
      for (const a of Object.keys(keyButtons)) {
        keyButtons[a].classList.remove("listening");
      }
      updateKeyButtonLabels();
    });

    document.addEventListener("keydown", (e) => {
      // 설정 창에서 새 키를 기다리는 중이면, 눌린 키를 그 액션에 배정한다.
      if (listeningForAction) {
        e.preventDefault();
        keyBindings[listeningForAction] = e.code;
        saveKeyBindings();
        keyButtons[listeningForAction].classList.remove("listening");
        listeningForAction = null;
        updateKeyButtonLabels();
        return;
      }

      const isGameKey =
        e.code === keyBindings.left ||
        e.code === keyBindings.right ||
        e.code === keyBindings.drop;

      if (isGameKey) {
        e.preventDefault(); // 스페이스바/방향키의 기본 스크롤 동작 방지
      }

      pressedKeys.add(e.code);

      if (e.code === keyBindings.drop && !e.repeat) {
        dropCurrentFruit(pointerX);
      }
    });

    document.addEventListener("keyup", (e) => {
      pressedKeys.delete(e.code);
    });

    // 매 프레임 눌려있는 이동 키에 따라 포인터 위치(= 다음 과일의 x좌표)를 이동시킨다.
    function applyKeyboardMovement(dt) {
      if (isGameOver) return;
      if (pressedKeys.has(keyBindings.left)) pointerX -= KEY_MOVE_SPEED * dt;
      if (pressedKeys.has(keyBindings.right)) pointerX += KEY_MOVE_SPEED * dt;
      pointerX = Math.max(0, Math.min(W, pointerX));
    }

    updateKeyButtonLabels();

    // ---- 물리 & 병합 ----

    function stepPhysics(dt) {
      for (const f of fruits) {
        f.vy += GRAVITY * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.vx *= AIR_FRICTION;
        f.vy *= AIR_FRICTION;

        // 벽 충돌
        if (f.x - f.radius < 0) {
          f.x = f.radius;
          f.vx *= -WALL_DAMPING;
        } else if (f.x + f.radius > W) {
          f.x = W - f.radius;
          f.vx *= -WALL_DAMPING;
        }

        // 바닥 충돌
        if (f.y + f.radius > H) {
          f.y = H - f.radius;
          f.vy *= -WALL_DAMPING;
        }

        const speed = Math.hypot(f.vx, f.vy);
        if (speed > MAX_SPEED) {
          f.vx *= MAX_SPEED / speed;
          f.vy *= MAX_SPEED / speed;
        }
      }

      handleMerges();

      // 여러 과일이 동시에 맞닿아 쌓인 상태는 한 번의 보정 패스로는 수렴하지 않으므로
      // 같은 프레임 안에서 여러 번 반복 보정해 안정적으로 정지하게 한다.
      for (let iter = 0; iter < COLLISION_ITERATIONS; iter++) {
        resolveOverlaps();
      }

      for (const f of fruits) {
        const speed = Math.abs(f.vx) + Math.abs(f.vy);
        f.settled = speed < SETTLED_SPEED_THRESHOLD;
      }
    }

    function handleMerges() {
      const merged = new Set();
      const toRemove = new Set();
      const toAdd = [];

      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (merged.has(a.id)) continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (merged.has(b.id)) continue;
          if (a.tier !== b.tier || a.tier >= FRUITS.length - 1) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = a.radius + b.radius;

          if (dist >= minDist) continue;

          const nx = (a.x + b.x) / 2;
          const ny = (a.y + b.y) / 2;
          const nextTier = a.tier + 1;

          merged.add(a.id);
          merged.add(b.id);
          toRemove.add(a.id);
          toRemove.add(b.id);
          toAdd.push(createFruit(nextTier, nx, ny));

          score += FRUITS[nextTier].score;
          trackMissionProgress(nextTier);
        }
      }

      if (toRemove.size > 0) {
        fruits = fruits.filter((f) => !toRemove.has(f.id));
        fruits.push(...toAdd);
        updateScoreUI();
      }
    }

    function resolveOverlaps() {
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = a.radius + b.radius;

          if (dist >= minDist) continue;

          // 완전히 같은 위치에 겹쳐서 생성된 경우, 거리 기반 방향 대신
          // 두 과일 id로 결정되는 고정 방향을 사용해 분리 방향이 매 프레임 흔들리지 않게 한다.
          let nx, ny, overlap;
          if (dist < 0.01) {
            const angle = ((a.id * 928371 + b.id * 6151) % 360) * (Math.PI / 180);
            nx = Math.cos(angle);
            ny = Math.sin(angle);
            overlap = minDist;
          } else {
            nx = dx / dist;
            ny = dy / dist;
            overlap = minDist - dist;
          }
          // 한 프레임에 순간이동하듯 튕기지 않도록 보정량 제한
          overlap = Math.min(overlap, MAX_CORRECTION_PER_STEP);

          const invMassA = 1 / (a.radius * a.radius);
          const invMassB = 1 / (b.radius * b.radius);
          const totalInv = invMassA + invMassB;

          a.x -= nx * overlap * (invMassA / totalInv);
          a.y -= ny * overlap * (invMassA / totalInv);
          b.x += nx * overlap * (invMassB / totalInv);
          b.y += ny * overlap * (invMassB / totalInv);

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const velAlongNormal = rvx * nx + rvy * ny;

          if (velAlongNormal > 0) continue;

          // 접촉 속도가 아주 작으면(쌓여서 정지한 상태) 반발을 주지 않아
          // 미세하게 계속 튕기며 settled 상태에 도달하지 못하는 것을 막는다.
          const restitution = -velAlongNormal < 40 ? 0 : RESTITUTION;
          const j2 = (-(1 + restitution) * velAlongNormal) / totalInv;
          const impulseX = j2 * nx;
          const impulseY = j2 * ny;

          a.vx -= impulseX * invMassA;
          a.vy -= impulseY * invMassA;
          b.vx += impulseX * invMassB;
          b.vy += impulseY * invMassB;
        }
      }
    }

    function checkGameOver(dt) {
      for (const f of fruits) {
        if (f.settled && f.y - f.radius < LINE_Y) {
          f.dangerTime += dt;
          if (f.dangerTime > DANGER_TIME_LIMIT) {
            triggerGameOver();
            return;
          }
        } else {
          f.dangerTime = 0;
        }
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreEl.textContent = score;
      gameOverEl.classList.remove("hidden");
    }

    // ---- 렌더링: 과일별 실제 모양 드로잉 ----

    function shadeColor(hex, percent) {
      const f = parseInt(hex.slice(1), 16);
      const t = percent < 0 ? 0 : 255;
      const p = Math.abs(percent);
      const R = f >> 16, G = (f >> 8) & 0xff, B = f & 0xff;
      const newColor =
        0x1000000 +
        (Math.round((t - R) * p) + R) * 0x10000 +
        (Math.round((t - G) * p) + G) * 0x100 +
        (Math.round((t - B) * p) + B);
      return "#" + newColor.toString(16).slice(1);
    }

    function fruitGradient(ctx, x, y, r, color) {
      const light = shadeColor(color, 0.4);
      const dark = shadeColor(color, -0.25);
      const grad = ctx.createRadialGradient(
        x - r * 0.35, y - r * 0.4, r * 0.15,
        x, y, r * 1.15
      );
      grad.addColorStop(0, light);
      grad.addColorStop(1, dark);
      return grad;
    }

    // 현재 활성화된 path를 과일 색 그라디언트로 채우고 테두리를 그린다.
    function fillAndOutline(ctx, x, y, r, color) {
      ctx.fillStyle = fruitGradient(ctx, x, y, r, color);
      ctx.fill();
      ctx.lineWidth = Math.max(1, r * 0.04);
      ctx.strokeStyle = "rgba(0,0,0,0.2)";
      ctx.stroke();
    }

    function drawHighlight(ctx, x, y, r) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(x - r * 0.35, y - r * 0.4, r * 0.28, r * 0.18, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 꼭지를 그리고 잎을 붙일 수 있도록 꼭지 끝 좌표를 반환한다.
    function drawStem(ctx, x, topY, len, angle = 0.3) {
      ctx.save();
      ctx.strokeStyle = "#6b4423";
      ctx.lineWidth = Math.max(1.5, len * 0.15);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x, topY);
      const tipX = x + len * 0.45 * Math.cos(angle);
      const tipY = topY - len * 0.7;
      ctx.quadraticCurveTo(x + len * 0.3 * Math.cos(angle), topY - len * 0.5, tipX, tipY);
      ctx.stroke();
      ctx.restore();
      return { x: tipX, y: tipY };
    }

    function drawLeaf(ctx, x, y, size, angle = -0.6) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = "#4c8c3c";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(size * 0.35, -size * 0.35, size * 0.75, -size * 0.05);
      ctx.quadraticCurveTo(size * 0.35, size * 0.15, 0, 0);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(size * 0.7, -size * 0.05);
      ctx.stroke();
      ctx.restore();
    }

    // ---- 과일별 실루엣 ----

    function shapeCherry(ctx, x, y, r, color) {
      ctx.beginPath();
      ctx.arc(x, y, r * 0.95, 0, Math.PI * 2);
      fillAndOutline(ctx, x, y, r, color);
      drawHighlight(ctx, x, y, r);
      const tip = drawStem(ctx, x, y - r * 0.9, r, 0.4);
      drawLeaf(ctx, tip.x, tip.y, r * 1.2, -0.4);
    }

    function shapeStrawberry(ctx, x, y, r, color) {
      const top = y - r * 0.75;
      const bottom = y + r * 1.05;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.9, top + r * 0.2);
      ctx.quadraticCurveTo(x - r * 1.05, top - r * 0.1, x - r * 0.5, top - r * 0.2);
      ctx.quadraticCurveTo(x, top - r * 0.35, x + r * 0.5, top - r * 0.2);
      ctx.quadraticCurveTo(x + r * 1.05, top - r * 0.1, x + r * 0.9, top + r * 0.2);
      ctx.quadraticCurveTo(x + r * 0.85, y + r * 0.5, x, bottom);
      ctx.quadraticCurveTo(x - r * 0.85, y + r * 0.5, x - r * 0.9, top + r * 0.2);
      ctx.closePath();
      fillAndOutline(ctx, x, y, r, color);

      ctx.fillStyle = "#f6e58d";
      const seeds = [
        [-0.5, -0.25], [0, -0.45], [0.5, -0.25],
        [-0.35, 0.05], [0.35, 0.05],
        [-0.15, 0.35], [0.15, 0.35],
        [0, 0.65], [-0.55, 0.2], [0.55, 0.2],
      ];
      for (const [ox, oy] of seeds) {
        ctx.save();
        ctx.translate(x + ox * r, y + oy * r);
        ctx.rotate(Math.atan2(oy, ox));
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.09, r * 0.05, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.fillStyle = "#4c8c3c";
      for (let i = -2; i <= 2; i++) {
        const angle = -Math.PI / 2 + i * 0.35;
        ctx.save();
        ctx.translate(x, top - r * 0.15);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-r * 0.14, -r * 0.35);
        ctx.lineTo(r * 0.14, -r * 0.35);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function shapeGrape(ctx, x, y, r, color) {
      const offsets = [
        [0, -0.55], [-0.45, -0.15], [0.45, -0.15],
        [-0.72, 0.3], [0, 0.25], [0.72, 0.3],
        [-0.35, 0.75], [0.35, 0.75], [0, 1.1],
      ];
      const berryR = r * 0.34;
      for (const [ox, oy] of offsets) {
        const bx = x + ox * r, by = y + oy * r * 0.85;
        ctx.beginPath();
        ctx.arc(bx, by, berryR, 0, Math.PI * 2);
        fillAndOutline(ctx, bx, by, berryR, color);
        drawHighlight(ctx, bx, by, berryR);
      }
      const tip = drawStem(ctx, x, y - r * 0.75, r, 0.2);
      drawLeaf(ctx, tip.x, tip.y, r, -0.5);
    }

    function shapeTangerine(ctx, x, y, r, color) {
      ctx.beginPath();
      ctx.arc(x, y, r * 0.95, 0, Math.PI * 2);
      fillAndOutline(ctx, x, y, r, color);
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      const dots = [
        [-0.4, -0.3], [0.3, -0.4], [0.5, 0.1],
        [-0.1, 0.4], [-0.5, 0.15], [0.1, -0.1], [0.15, 0.5],
      ];
      for (const [ox, oy] of dots) {
        ctx.beginPath();
        ctx.arc(x + ox * r, y + oy * r, r * 0.07, 0, Math.PI * 2);
        ctx.fill();
      }
      drawHighlight(ctx, x, y, r);
      const tip = drawStem(ctx, x, y - r * 0.9, r * 0.6, 0);
      drawLeaf(ctx, tip.x, tip.y, r * 0.8, -0.6);
    }

    function shapeLemon(ctx, x, y, r, color) {
      const rx = r * 1.05, ry = r * 0.8;
      ctx.beginPath();
      ctx.moveTo(x - rx, y);
      ctx.quadraticCurveTo(x - rx * 0.85, y - ry, x, y - ry);
      ctx.quadraticCurveTo(x + rx * 0.85, y - ry, x + rx, y);
      ctx.quadraticCurveTo(x + rx * 0.85, y + ry, x, y + ry);
      ctx.quadraticCurveTo(x - rx * 0.85, y + ry, x - rx, y);
      ctx.closePath();
      fillAndOutline(ctx, x, y, r, color);
      drawHighlight(ctx, x, y, r);
      ctx.fillStyle = "#c9a227";
      ctx.beginPath();
      ctx.ellipse(x + rx, y, r * 0.08, r * 0.06, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function shapeApple(ctx, x, y, r, color) {
      const rad = r * 0.95;
      const topAngle = -Math.PI / 2;
      const spread = 0.4;
      const leftX = x + rad * Math.cos(topAngle - spread);
      const leftY = y + rad * Math.sin(topAngle - spread);
      const rightX = x + rad * Math.cos(topAngle + spread);
      const rightY = y + rad * Math.sin(topAngle + spread);
      ctx.beginPath();
      ctx.moveTo(leftX, leftY);
      ctx.quadraticCurveTo(x, y - rad * 0.55, rightX, rightY);
      ctx.arc(x, y, rad, topAngle + spread, topAngle - spread + Math.PI * 2, false);
      ctx.closePath();
      fillAndOutline(ctx, x, y, r, color);
      drawHighlight(ctx, x, y, r);
      const tip = drawStem(ctx, x, y - rad * 0.5, r, 0.3);
      drawLeaf(ctx, tip.x, tip.y, r, -0.5);
    }

    function shapePear(ctx, x, y, r, color) {
      const topR = r * 0.55;
      const botR = r * 1.0;
      const topY = y - r * 0.55;
      const botY = y + r * 0.4;
      ctx.beginPath();
      ctx.moveTo(x - topR, topY);
      ctx.bezierCurveTo(x - topR, topY - topR * 0.9, x + topR, topY - topR * 0.9, x + topR, topY);
      ctx.bezierCurveTo(x + topR * 1.4, topY + topR * 0.7, x + botR * 1.05, botY - botR * 0.7, x + botR, botY);
      ctx.bezierCurveTo(x + botR, botY + botR * 0.85, x - botR, botY + botR * 0.85, x - botR, botY);
      ctx.bezierCurveTo(x - botR * 1.05, botY - botR * 0.7, x - topR * 1.4, topY + topR * 0.7, x - topR, topY);
      ctx.closePath();
      fillAndOutline(ctx, x, y, r, color);
      drawHighlight(ctx, x, y - r * 0.2, r * 0.8);
      const tip = drawStem(ctx, x, topY - topR * 0.3, r * 0.7, 0.2);
      drawLeaf(ctx, tip.x, tip.y, r * 0.9, -0.6);
    }

    function shapePeach(ctx, x, y, r, color) {
      const rad = r * 0.95;
      const topAngle = -Math.PI / 2;
      const spread = 0.3;
      const leftX = x + rad * Math.cos(topAngle - spread);
      const leftY = y + rad * Math.sin(topAngle - spread);
      const rightX = x + rad * Math.cos(topAngle + spread);
      const rightY = y + rad * Math.sin(topAngle + spread);
      ctx.beginPath();
      ctx.moveTo(leftX, leftY);
      ctx.quadraticCurveTo(x, y - rad * 0.75, rightX, rightY);
      ctx.arc(x, y, rad, topAngle + spread, topAngle - spread + Math.PI * 2, false);
      ctx.closePath();
      fillAndOutline(ctx, x, y, r, color);
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.beginPath();
      ctx.moveTo(x, y - rad * 0.6);
      ctx.quadraticCurveTo(x - r * 0.15, y, x, y + rad * 0.8);
      ctx.stroke();
      ctx.restore();
      drawHighlight(ctx, x, y, r);
      const tip = drawStem(ctx, x, y - rad * 0.5, r * 0.6, 0.3);
      drawLeaf(ctx, tip.x, tip.y, r * 0.8, -0.5);
    }

    function shapePineapple(ctx, x, y, r, color) {
      const rx = r * 0.7, ry = r * 1.0;
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.05, rx, ry, 0, 0, Math.PI * 2);
      fillAndOutline(ctx, x, y, r, color);

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.05, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.lineWidth = Math.max(1, r * 0.035);
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x - rx * 1.2, y + i * r * 0.35);
        ctx.lineTo(x + rx * 1.2, y + i * r * 0.35 + r * 1.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - rx * 1.2, y + i * r * 0.35 + r * 1.3);
        ctx.lineTo(x + rx * 1.2, y + i * r * 0.35);
        ctx.stroke();
      }
      ctx.restore();
      drawHighlight(ctx, x, y, r * 0.8);

      ctx.fillStyle = "#3f7d3a";
      const leafCount = 5;
      for (let i = 0; i < leafCount; i++) {
        const t = (i - (leafCount - 1) / 2) * 0.35;
        ctx.save();
        ctx.translate(x, y - ry * 0.95);
        ctx.rotate(t);
        ctx.beginPath();
        ctx.moveTo(-r * 0.12, 0);
        ctx.lineTo(0, -r * 0.75);
        ctx.lineTo(r * 0.12, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function shapeMelon(ctx, x, y, r, color) {
      ctx.beginPath();
      ctx.arc(x, y, r * 0.98, 0, Math.PI * 2);
      fillAndOutline(ctx, x, y, r, color);

      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r * 0.98, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = Math.max(1, r * 0.025);
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x - r * 1.2, y + i * r * 0.32);
        ctx.bezierCurveTo(
          x - r * 0.4, y + i * r * 0.32 + r * 0.25,
          x + r * 0.4, y + i * r * 0.32 - r * 0.25,
          x + r * 1.2, y + i * r * 0.32
        );
        ctx.stroke();
      }
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * r * 0.32, y - r * 1.2);
        ctx.bezierCurveTo(
          x + i * r * 0.32 + r * 0.25, y - r * 0.4,
          x + i * r * 0.32 - r * 0.25, y + r * 0.4,
          x + i * r * 0.32, y + r * 1.2
        );
        ctx.stroke();
      }
      ctx.restore();
      drawHighlight(ctx, x, y, r);
      const tip = drawStem(ctx, x, y - r * 0.95, r * 0.6, 0);
      drawLeaf(ctx, tip.x, tip.y, r * 0.7, -0.6);
    }

    function shapeWatermelon(ctx, x, y, r, color) {
      ctx.beginPath();
      ctx.arc(x, y, r * 0.98, 0, Math.PI * 2);
      fillAndOutline(ctx, x, y, r, color);

      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r * 0.98, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = "rgba(0,80,30,0.55)";
      const stripeCount = 7;
      for (let i = 0; i < stripeCount; i++) {
        const t = (i - (stripeCount - 1) / 2) * 0.42;
        ctx.beginPath();
        ctx.moveTo(x + t * r - r * 0.09, y - r * 1.2);
        ctx.quadraticCurveTo(x + t * r + r * 0.12, y, x + t * r - r * 0.09, y + r * 1.2);
        ctx.lineTo(x + t * r + r * 0.09, y + r * 1.2);
        ctx.quadraticCurveTo(x + t * r + r * 0.3, y, x + t * r + r * 0.09, y - r * 1.2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      drawHighlight(ctx, x, y, r);
      const tip = drawStem(ctx, x, y - r * 0.95, r * 0.5, 0);
      drawLeaf(ctx, tip.x, tip.y, r * 0.6, -0.6);
    }

    const FRUIT_SHAPE_DRAWERS = [
      shapeCherry,
      shapeStrawberry,
      shapeGrape,
      shapeTangerine,
      shapeLemon,
      shapeApple,
      shapePear,
      shapePeach,
      shapePineapple,
      shapeMelon,
      shapeWatermelon,
    ];

    function drawFruitByTier(tier, x, y, r, color) {
      const drawer = FRUIT_SHAPE_DRAWERS[tier];
      if (drawer) {
        drawer(ctx, x, y, r, color);
      } else {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        fillAndOutline(ctx, x, y, r, color);
      }
    }

    function drawFruit(f) {
      const def = FRUITS[f.tier];
      drawFruitByTier(f.tier, f.x, f.y, f.radius, def.color);
    }

    function drawCurrentFruit() {
      if (isGameOver) return;
      const def = FRUITS[currentFruitTier];
      const radius = def.radius;
      const x = Math.max(radius, Math.min(W - radius, pointerX));
      const y = LINE_Y - radius - 10;

      ctx.globalAlpha = 0.85;
      drawFruitByTier(currentFruitTier, x, y, radius, def.color);
      ctx.globalAlpha = 1;
    }

    function drawLine() {
      ctx.beginPath();
      ctx.setLineDash([6, 6]);
      ctx.moveTo(0, LINE_Y);
      ctx.lineTo(W, LINE_Y);
      ctx.strokeStyle = "#e74c3c";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawLine();
      for (const f of fruits) drawFruit(f);
      drawCurrentFruit();
    }

    // ---- 메인 루프 ----

    let lastTime = null;
    const FIXED_DT = 1 / 120;

    function loop(timestamp) {
      if (lastTime === null) lastTime = timestamp;
      let frameDt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      frameDt = Math.min(frameDt, 0.05); // 탭 전환 등으로 인한 큰 점프 방지

      if (dropCooldownTimer > 0) dropCooldownTimer -= frameDt;

      applyKeyboardMovement(frameDt);

      if (!isGameOver) {
        let remaining = frameDt;
        while (remaining > 0) {
          const dt = Math.min(FIXED_DT, remaining);
          stepPhysics(dt);
          checkGameOver(dt);
          remaining -= dt;
        }
      }

      render();
      requestAnimationFrame(loop);
    }

    resetGame();
    requestAnimationFrame(loop);
  </script>
